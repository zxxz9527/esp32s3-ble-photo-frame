; ============================================================
;  ESP32-S3 蓝牙图片显示器 - PlatformIO 工程配置
;  PlatformIO Project Configuration File
; ============================================================
;  文档: https://docs.platformio.org/page/projectconf.html
; ------------------------------------------------------------
;  目标: ESP32-S3-DevKitC-1 (Arduino 框架)
;  功能: BLE 蓝牙接收 JPG -> 3.6寸 ST7793 并口屏 (400x240 横屏) 显示
;        -> LittleFS 保存图片 (断电保留)
;  电脑端: 用 Edge/Chrome 打开 ../tools/photo_uploader.html
; ============================================================

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; ---- 串口 ----
monitor_speed = 115200
upload_speed  = 921600

; ---- Flash 容量与分区表 ----
; 图片保存在 LittleFS 数据分区，必须使用带 spiffs 的分区表。
; 常见 ESP32-S3 DevKit 模块为 16MB Flash (如 N16R8)，用下面两行：
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
; 若你的模块是  8MB Flash，改为：
;   board_upload.flash_size = 8MB
;   board_build.partitions  = default_8MB.csv
; 若你的模块是  4MB Flash，改为：
;   board_upload.flash_size = 4MB
;   board_build.partitions  = default.csv

; ---- PSRAM ----
; 本工程目标芯片为 ESP32-S3-N16R8 (16MB Flash + 8MB 八线 Octal PSRAM)，
; 启用 PSRAM 供 BLE 协议栈/图像缓冲使用 (JPEG 解码本身只需约 4KB)。
board_build.arduino.memory_type = qio_opi   ; QIO Flash + OPI PSRAM
build_flags =
    -DBOARD_HAS_PSRAM

; ---- 库依赖 ----
; BLE 与 LittleFS 为 arduino-esp32 框架自带，无需声明；
; 仅需额外安装显示库 LovyanGFX。
lib_deps =
    lovyan03/LovyanGFX
